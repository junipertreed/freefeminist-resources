---
layout: base
---
<article>
    <header class="post-header">
        <h1 class="post-title">{{ page.title | escape }}</h1>
    </header>
<div>
<ul>
    {% assign this_tag = page.shortTitle | downcase %}
    {% for post in site.documents %}
    {% if post.tags contains this_tag %}
    <li>
        <a href="/freefeminist-resources{{ post.url }}">{{ post.title }}</a>
    </li>
    {% endif %}
    {% endfor %}
</ul>
Browse more <a href="/freefeminist-resources/tags">tags</a>.
</div>
</article>
